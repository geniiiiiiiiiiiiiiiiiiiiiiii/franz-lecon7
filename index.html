PAGES.quiz = m => {
  const LV = { easy: ['Leicht', 'etwa Note 4', 1], medium: ['Mittel', 'etwa Note 5', 2], hard: ['Schwer', 'etwa Note 6', 3] };
  let level = S.quizLevel || 'medium';
  let qs = [], i = 0, score = 0, locked = false, wrong = [];

  function home() {
    keyHandler = null;
    m.innerHTML = `<div class="page narrow">${pageHead('Quiz', 'Wähle eine Stufe. Du bekommst 15 zufällige Fragen aus allen vier Lernzielen und nach jeder Antwort eine Erklärung.')}
      <div class="levels">${Object.entries(LV).map(([k, [t, d, n]]) => `
        <button class="level ${k === level ? 'on' : ''}" data-lv="${k}" type="button"><span class="lv-bars">${[1, 2, 3].map(x => `<i class="${x <= n ? 'f' : ''}"></i>`).join('')}</span><b>${t}</b><small>${d} · ${QUIZ[k].length} Fragen im Pool</small></button>`).join('')}</div>
      <div class="row" style="margin-top:22px"><button class="btn btn-p btn-lg" data-a="start" type="button">Quiz starten ${icon('arrowR')}</button></div>
      <div class="sec-h"><h2>Letzte Versuche</h2></div>
      ${histTable(S.quizHist, h => 'Quiz ' + LV[h.lv][0])}
    </div>`;
  }
  function start() {
    // aus jedem Lernziel mindestens 2 Fragen, der Rest zufällig
    const pool = QUIZ[level];
    const base = [1, 2, 3, 4].flatMap(z => pick(pool.filter(q => q.lz === z), 2));
    const rest = pick(pool.filter(q => !base.includes(q)), Math.min(15, pool.length) - base.length);
    qs = shuffle([...base, ...rest]).map(q => ({ ...q, opts: shuffle(q.a.map((t, k) => ({ t, ok: k === 0 }))) }));
    i = 0; score = 0; wrong = [];
    keyHandler = (e, typing) => {
      if (typing) return;
      if (/^[1-4]$/.test(e.key) && !locked) answer(+e.key - 1);
      else if (e.key === 'Enter' && locked) { e.preventDefault(); next(); }
    };
    draw();
  }
  function draw() {
    const q = qs[i];
    locked = false;
    m.innerHTML = `<div class="page qz">
      <div class="qz-head"><span>Frage ${i + 1} von ${qs.length} · ${LV[level][0]}</span><span>${score} richtig</span></div>
      <div class="bar dark" style="margin-bottom:18px"><i style="width:${i / qs.length * 100}%"></i></div>
      <div class="card qz-card">
        <div class="qz-lz">Lernziel ${q.lz} · ${LZ[q.lz - 1].short}</div>
        <div class="qz-q">${esc(q.q)}</div>
        <div class="opts" id="opts">${q.opts.map((o, k) => `<button class="opt" data-o="${k}" type="button"><span class="opt-l">${'ABCD'[k]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
        <div id="fb"></div>
      </div>
      <div class="qz-foot"><span class="muted" style="font-size:14px">Antworten mit <span class="kbd">1</span> bis <span class="kbd">4</span>, weiter mit <span class="kbd">Enter</span></span><button class="btn btn-g" data-a="quit" type="button">Abbrechen</button></div>
    </div>`;
  }
  function answer(k) {
    if (locked) return;
    locked = true;
    const q = qs[i], o = q.opts[k];
    $('#opts', m).classList.add('locked');
    $$('.opt', m).forEach((b, j) => { if (q.opts[j].ok) b.classList.add('ok'); else if (j === k) b.classList.add('no'); });
    if (o.ok) score++; else wrong.push({ q, given: o.t });
    $('#fb', m).innerHTML = `<div class="fb ${o.ok ? 'ok' : 'no'}" style="margin-top:18px"><span class="fb-t">${icon(o.ok ? 'check' : 'x')}${o.ok ? 'Richtig!' : 'Leider falsch'}</span><span class="fb-x">${esc(q.ex)}</span></div>
      <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn btn-p" data-a="next" type="button">${i === qs.length - 1 ? 'Zur Auswertung' : 'Weiter'} ${icon('arrowR')}</button></div>`;
    $('.qz-head span:last-child', m).textContent = `${score} richtig`;
    $('[data-a="next"]', m).focus({ preventScroll: true });
  }
  function next() { if (i < qs.length - 1) { i++; draw(); window.scrollTo(0, 0); } else end(); }
  function end() {
    keyHandler = null;
    const p = score / qs.length, g = gradeOf(p);
    S.quizHist.unshift({ t: Date.now(), lv: level, s: score, n: qs.length, g });
    S.quizHist = S.quizHist.slice(0, 8);
    save();
    m.innerHTML = `<div class="page qz"><div class="card result">
        <span class="badge-ic">${icon(score === qs.length ? 'trophy' : 'target')}</span>
        <div class="grade-l">Geschätzte Note</div><div class="grade">${fmtGrade(g)}</div>
        <h2>${gradeText(g)}</h2>
        <div class="res-stats"><div><b>${score}/${qs.length}</b><span>richtig</span></div><div><b>${Math.round(p * 100)}%</b><span>Trefferquote</span></div><div><b>${LV[level][0]}</b><span>Stufe</span></div></div>
        <div class="row" style="justify-content:center;margin-top:8px"><button class="btn btn-p" data-a="start" type="button">${icon('rotate')}Nochmals</button><button class="btn btn-s" data-a="home" type="button">Andere Stufe</button></div>
      </div>
      ${wrong.length ? `<div class="sec-h"><h2>Deine Fehler</h2><p>Lies die Erklärungen nochmals durch.</p></div><div class="review">${wrong.map(w => `
        <div class="rv no"><span class="rv-q">${esc(w.q.q)}</span><span class="rv-a">Deine Antwort: <b class="y">${esc(w.given)}</b> · Richtig: <b class="c">${esc(w.q.a[0])}</b></span><span class="rv-x">${esc(w.q.ex)}</span></div>`).join('')}</div>` : ''}
    </div>`;
    window.scrollTo(0, 0);
    if (score === qs.length) confetti();
  }
  m.addEventListener('click', e => {
    const b = e.target.closest('[data-a],[data-lv],[data-o]');
    if (!b) return;
    if (b.dataset.lv) { level = b.dataset.lv; S.quizLevel = level; save(); home(); return; }
    if (b.dataset.o !== undefined) { answer(+b.dataset.o); return; }
    ({ start, next, quit: home, home })[b.dataset.a]?.();
  });
  home();
};

/* ===== Prüfungssimulation ===== */
PAGES.exam = m => {
  const DURATION = 15 * 60 * 1000;
  let tasks = [], ans = [], cur = 0, timer = null, endAt = 0, armed = false, armT = null;
  onLeave(() => { clearInterval(timer); clearTimeout(armT); });

  function home() {
    keyHandler = null;
    m.innerHTML = `<div class="page narrow">${pageHead('Prüfungssimulation', '15 gemischte Aufgaben aus allen vier Lernzielen in 15 Minuten. Wie in der echten Prüfung siehst du erst am Schluss, was richtig war.')}
      <div class="card settings">
        <div class="fields" style="margin:0">
          <div class="field"><b>${icon('quiz')}6 × Multiple Choice</b><div>Grammatik und Wortschatz</div></div>
          <div class="field"><b>${icon('pen')}4 × Lückentext</b><div>Formen selbst eintippen</div></div>
          <div class="field"><b>${icon('link')}2 × Zuordnung</b><div>je 4 Paare</div></div>
          <div class="field"><b>${icon('keyboard')}3 × Übersetzung</b><div>FR → DE und DE → FR</div></div>
        </div>
        ${H.box('amber', 'So läuft es', '<p>Du hast <b>15 Minuten</b>. Du kannst zwischen den Aufgaben hin und her springen. Akzente zählen. Wenn die Zeit abläuft, wird automatisch abgegeben.</p>')}
        <div class="row"><button class="btn btn-p btn-lg" data-a="begin" type="button">${icon('timer')}Prüfung starten</button></div>
      </div>
      <div class="sec-h"><h2>Letzte Versuche</h2></div>
      ${histTable(S.examHist, () => 'Prüfung')}
    </div>`;
    decorate(m);
  }
  function build() {
    const mc = pick([...QUIZ.medium, ...QUIZ.hard], 6).map(q => ({ type: 'mc', q, opts: shuffle(q.a.map((t, k) => ({ t, ok: k === 0 }))) }));
    const gp = pick(GAPS.flatMap(s => s.items.map(it => ({ it, set: s }))), 4).map(x => ({ type: 'gap', ...x }));
    const mt = [MATCH[1], MATCH[2]].map(set => { const pairs = pick(set.pairs, 4); return { type: 'match', set, pairs, rights: shuffle(pairs.map(p => p[1])) }; });
    const dirs = shuffle(['fd', 'df', Math.random() < .5 ? 'fd' : 'df']);
    const tr = pick(WORDS, 3).map((v, k) => ({ type: 'trans', dir: dirs[k], v }));
    return shuffle([...mc, ...gp, ...mt, ...tr]);
  }
  function begin() {
    tasks = build();
    ans = tasks.map(t => t.type === 'match' ? ['', '', '', ''] : t.type === 'mc' ? null : '');
    cur = 0; armed = false;
    endAt = Date.now() + DURATION;
    m.innerHTML = `<div class="page narrow">
      <div class="card ex-top"><div class="ex-sub"><b>Prüfungssimulation</b><div class="muted" style="font-size:14px"><span id="exAns">0</span> von ${tasks.length} beantwortet</div></div>
        <div class="timer" id="timer">${icon('clock')}<span>15:00</span></div>
        <button class="btn btn-p" data-a="submit" id="submitBtn" type="button">Abgeben</button></div>
      <div class="ex-nums" id="exNums"></div>
      <div class="card qz-card" id="exTask"></div>
      <div class="row" style="justify-content:space-between;margin-top:18px"><button class="btn btn-s" data-a="prev" type="button">${icon('arrowL')}Zurück</button><button class="btn btn-p" data-a="fwd" type="button">Weiter ${icon('arrowR')}</button></div>
    </div>`;
    timer = setInterval(tick, 500);
    tick();
    keyHandler = (e, typing) => {
      if (typing) { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); goTo(cur + 1); } return; }
      if (e.key === 'ArrowRight') goTo(cur + 1);
      if (e.key === 'ArrowLeft') goTo(cur - 1);
      if (/^[1-4]$/.test(e.key) && tasks[cur].type === 'mc') { ans[cur] = +e.key - 1; drawTask(); nums(); }
    };
    drawTask(); nums();
  }
  function tick() {
    const left = Math.max(0, endAt - Date.now());
    const s = Math.ceil(left / 1000);
    const el = $('#timer', m);
    if (!el) return;
    el.querySelector('span').textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    el.classList.toggle('warn', s <= 180 && s > 60);
    el.classList.toggle('crit', s <= 60);
    if (left <= 0) finish(true);
  }
  const answered = k => {
    const t = tasks[k], a = ans[k];
    if (t.type === 'mc') return a !== null;
    if (t.type === 'match') return a.some(x => x);
    return String(a).trim() !== '';
  };
  function nums() {
    $('#exNums', m).innerHTML = tasks.map((_, k) => `<button class="ex-num ${answered(k) ? 'ans' : ''} ${k === cur ? 'cur' : ''}" data-n="${k}" type="button" aria-label="Aufgabe ${k + 1}">${k + 1}</button>`).join('');
    $('#exAns', m).textContent = tasks.filter((_, k) => answered(k)).length;
  }
  function drawTask() {
    const t = tasks[cur], a = ans[cur];
    let html = '';
    if (t.type === 'mc') {
      html = `<div class="ex-type">Aufgabe ${cur + 1} · Multiple Choice · Lernziel ${t.q.lz}</div><div class="ex-task">${esc(t.q.q)}</div>
        <div class="opts">${t.opts.map((o, k) => `<button class="opt ${a === k ? 'sel' : ''}" data-o="${k}" type="button"><span class="opt-l">${'ABCD'[k]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>`;
    } else if (t.type === 'gap') {
      const [pre, , post] = t.it.t.split(/\{([^}]*)\}/);
      html = `<div class="ex-type">Aufgabe ${cur + 1} · Lückentext · ${t.set.title}</div><div class="ex-task" style="font-weight:500">${t.set.task}</div>
        <div class="gap" style="box-shadow:none"><span class="gap-n">${icon('pen')}</span><div><span class="gap-q">${esc(t.it.q)}</span>${esc(pre)}<input class="inp" data-f="gap" value="${esc(a)}" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:16ch" aria-label="Lücke">${esc(post)} <span class="hint">(${esc(t.it.h)})</span></div></div>`;
    } else if (t.type === 'match') {
      html = `<div class="ex-type">Aufgabe ${cur + 1} · Zuordnung · ${t.set.title}</div><div class="ex-task">${t.set.task}</div>
        <div class="ex-match">${t.pairs.map((p, k) => `<div class="ex-match-r"><div>${esc(p[0])}</div><select class="inp" data-f="match" data-k="${k}" aria-label="Zuordnung ${k + 1}"><option value="">Wähle …</option>${t.rights.map(r => `<option ${a[k] === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select></div>`).join('')}</div>`;
    } else {
      const fd = t.dir === 'fd';
      html = `<div class="ex-type">Aufgabe ${cur + 1} · Übersetzung · ${fd ? 'Französisch → Deutsch' : 'Deutsch → Französisch'}</div>
        <div class="ex-task">${esc(fd ? t.v.fr : t.v.de)}</div>
        <input class="inp" data-f="trans" value="${esc(a)}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${fd ? 'Deutsche Übersetzung' : 'Französisch, Nomen mit un/une'}" aria-label="Übersetzung">`;
    }
    $('#exTask', m).innerHTML = html;
    $('[data-a="prev"]', m).disabled = cur === 0;
    $('[data-a="fwd"]', m).disabled = cur === tasks.length - 1;
    const inp = $('#exTask input', m);
    if (inp && matchMedia('(min-width: 900px)').matches) inp.focus({ preventScroll: true });
  }
  function goTo(k) { if (k < 0 || k >= tasks.length) return; cur = k; drawTask(); nums(); }
  function onField(e) {
    const el = e.target;
    if (!el.dataset || !el.dataset.f) return;
    if (el.dataset.f === 'match') ans[cur][+el.dataset.k] = el.value;
    else ans[cur] = el.value;
    nums();
  }
  m.addEventListener('input', onField);
  m.addEventListener('change', onField);

  function submit() {
    const open = tasks.filter((_, k) => !answered(k)).length;
    const b = $('#submitBtn', m);
    if (open && !armed) {
      armed = true;
      b.textContent = `Wirklich abgeben? ${open} offen`;
      b.classList.replace('btn-p', 'btn-no');
      armT = setTimeout(() => { armed = false; if (b.isConnected) { b.textContent = 'Abgeben'; b.classList.replace('btn-no', 'btn-p'); } }, 4000);
      return;
    }
    finish(false);
  }
  function finish(timeUp) {
    clearInterval(timer); clearTimeout(armT);
    keyHandler = null;
    let pts = 0;
    const rows = tasks.map((t, k) => {
      const a = ans[k];
      if (t.type === 'mc') {
        const ok = a !== null && t.opts[a].ok;
        pts += ok ? 1 : 0;
        return { st: ok ? 'ok' : 'no', q: t.q.q, your: a === null ? 'keine Antwort' : t.opts[a].t, right: t.q.a[0], x: t.q.ex, p: ok ? 1 : 0 };
      }
      if (t.type === 'gap') {
        const alts = t.it.t.match(/\{([^}]*)\}/)[1].split('|');
        const r = CHECK.fr(a, alts).r, ok = CHECK.right(r, true);
        pts += ok ? 1 : 0;
        return { st: ok ? 'ok' : 'no', q: `${t.it.q} ${t.it.t.replace(/\{[^}]*\}/, '___')}`, your: a.trim() || 'keine Antwort', right: alts[0], x: ok ? '' : CHECK.MSG[r], p: ok ? 1 : 0 };
      }
      if (t.type === 'match') {
        const n = t.pairs.filter((p, j) => a[j] === p[1]).length;
        pts += n / 4;
        return { st: n === 4 ? 'ok' : n ? 'half' : 'no', q: t.set.task, your: `${n} von 4 Paaren richtig`, right: t.pairs.map(p => `${p[0]} ${p[1]}`).join(' · '), x: '', p: n / 4 };
      }
      const fd = t.dir === 'fd';
      const r = fd ? CHECK.deWord(a, t.v) : frAny(a, t.v);
      const ok = CHECK.right(r, true);
      pts += ok ? 1 : 0;
      return { st: ok ? 'ok' : 'no', q: `Übersetze: ${fd ? t.v.fr : t.v.de}`, your: a.trim() || 'keine Antwort', right: fd ? t.v.de : t.v.fr, x: ok || r === 'wrong' || r === 'empty' ? '' : CHECK.MSG[r], p: ok ? 1 : 0 };
    });
    const g = gradeOf(pts / tasks.length);
    const used = Math.min(DURATION, DURATION - Math.max(0, endAt - Date.now()));
    S.examHist.unshift({ t: Date.now(), s: Math.round(pts * 100) / 100, n: tasks.length, g });
    S.examHist = S.examHist.slice(0, 8);
    save();
    const fmtP = x => String(Math.round(x * 100) / 100);
    m.innerHTML = `<div class="page narrow"><div class="card result">
        <span class="badge-ic">${icon(pts === tasks.length ? 'trophy' : 'flag')}</span>
        ${timeUp ? '<p><b>Die Zeit ist abgelaufen.</b> Deine Antworten wurden automatisch abgegeben.</p>' : ''}
        <div class="grade-l">Geschätzte Note</div><div class="grade">${fmtGrade(g)}</div>
        <h2>${gradeText(g)}</h2>
        <div class="res-stats"><div><b>${fmtP(pts)}/${tasks.length}</b><span>Punkte</span></div><div><b>${Math.round(pts / tasks.length * 100)}%</b><span>erreicht</span></div><div><b>${Math.floor(used / 60000)}:${String(Math.floor(used / 1000) % 60).padStart(2, '0')}</b><span>Minuten gebraucht</span></div></div>
        <div class="row" style="justify-content:center;margin-top:8px"><button class="btn btn-p" data-a="begin" type="button">${icon('rotate')}Neue Prüfung</button><button class="btn btn-s" data-a="home" type="button">Übersicht</button></div>
      </div>
      <div class="sec-h"><h2>Korrektur</h2><p>Alle Aufgaben mit deiner Antwort und der richtigen Lösung.</p></div>
      <div class="review">${rows.map((r, k) => `
        <div class="rv ${r.st}"><span class="rv-q">${k + 1}. ${esc(r.q)} <span class="muted" style="font-weight:500">(${fmtP(r.p)} P.)</span></span>
        <span class="rv-a">Deine Antwort: <b class="${r.st === 'ok' ? 'c' : 'y'}">${esc(r.your)}</b>${r.st === 'ok' ? '' : ` · Richtig: <b class="c">${esc(r.right)}</b>`}</span>
        ${r.x ? `<span class="rv-x">${esc(r.x)}</span>` : ''}</div>`).join('')}</div>
    </div>`;
    window.scrollTo(0, 0);
    if (pts === tasks.length) confetti();
  }
  m.addEventListener('click', e => {
    const b = e.target.closest('[data-a],[data-o],[data-n]');
    if (!b) return;
    if (b.dataset.o !== undefined) { ans[cur] = +b.dataset.o; drawTask(); nums(); return; }
    if (b.dataset.n !== undefined) { goTo(+b.dataset.n); return; }
    ({ begin, home, submit, prev: () => goTo(cur - 1), fwd: () => goTo(cur + 1) })[b.dataset.a]?.();
  });
  home();
};

/* ===== Karteikarten ===== */
PAGES.flash = m => {
  const DECKS = [['all', 'Alle Wörter'], ['E', 'Entrée'], ['A', 'Atelier A'], ['B', 'Atelier B'], ['D', 'Zusatz: Berufe'], ['gram', 'Grammatik']];
  let deck = S.fcDeck || 'all', dir = S.fcDir || 'fd', onlyNew = !!S.fcOnlyNew;
  let list = [], queue = [], flipped = false;
  const cardsOf = d => d === 'gram' ? FLASH_GRAM : d === 'all' ? WORDS : VOCAB.filter(v => v.sec === d);
  m.innerHTML = `<div class="page">${pageHead('Karteikarten', 'Dreh die Karte um und sag ehrlich, ob du es wusstest. Karten mit «Nochmals» kommen bald wieder. Dein Fortschritt wird gespeichert.')}
    <div class="tools" id="fcTools"></div><div class="fc-wrap" id="fcArea"></div></div>`;

  function tools() {
    $('#fcTools', m).innerHTML = `<div class="chips">${DECKS.map(([k, t]) => `<button class="chip ${deck === k ? 'on' : ''}" data-d="${k}" type="button">${t} <small>${cardsOf(k).length}</small></button>`).join('')}</div>
      <div class="row">
        <div class="chips">${deck === 'gram' ? '' : `<button class="chip ${dir === 'fd' ? 'on' : ''}" data-dir="fd" type="button">Französisch → Deutsch</button><button class="chip ${dir === 'df' ? 'on' : ''}" data-dir="df" type="button">Deutsch → Französisch</button>`}</div>
        <div class="row">${sw('fcNew', 'Nur noch nicht gewusste', onlyNew)}<button class="btn btn-s" data-a="shuffle" type="button">${icon('shuffle')}Mischen</button><button class="btn btn-g" data-a="reset" type="button">${icon('rotate')}Zurücksetzen</button></div>
      </div>`;
  }
  function build(shuf) {
    list = cardsOf(deck);
    queue = list.filter(c => !onlyNew || !S.known[c.id]);
    if (shuf) queue = shuffle(queue);
    flipped = false;
    draw();
  }
  function faces(c) {
    if (deck === 'gram') return { tag: 'Grammatik', front: `<div class="fc-word sm">${esc(c.front)}</div>`, back: `<div class="fc-ans sm">${esc(c.back)}</div>` };
    const sec = SECTIONS[c.sec].name;
    const extra = `${c.ex ? `<div class="fc-ex">${esc(c.ex)}</div>` : ''}${c.note ? `<div class="fc-note">${esc(c.note)}</div>` : ''}`;
    return dir === 'fd'
      ? { tag: sec, front: `<div class="fc-word ${c.fr.length > 28 ? 'sm' : ''}">${esc(c.fr)}</div>`, back: `<div class="fc-ans">${esc(c.de)}</div>${extra}` }
      : { tag: sec, front: `<div class="fc-word ${c.de.length > 28 ? 'sm' : ''}">${esc(c.de)}</div>`, back: `<div class="fc-ans">${esc(c.fr)}</div>${extra}` };
  }
  function draw() {
    tools();
    const known = list.filter(c => S.known[c.id]).length;
    const meta = `<div class="fc-meta"><span>${known} von ${list.length} gewusst</span><span>${queue.length} im Stapel</span></div><div class="bar"><i style="width:${known / Math.max(1, list.length) * 100}%"></i></div>`;
    const area = $('#fcArea', m);
    if (!queue.length) {
      area.innerHTML = `${meta}<div class="card result"><span class="badge-ic">${icon('trophy')}</span><h2>Stapel geschafft</h2>
        <p>${known === list.length ? 'Du hast alle Karten dieses Stapels gewusst.' : 'Für diese Runde sind keine Karten mehr übrig.'}</p>
        <div class="row" style="justify-content:center;margin-top:8px"><button class="btn btn-p" data-a="all" type="button">${icon('rotate')}Alle nochmals üben</button><button class="btn btn-s" data-a="reset" type="button">Gewusste zurücksetzen</button></div></div>`;
      if (known === list.length && list.length) confetti();
      return;
    }
    const c = queue[0], f = faces(c);
    area.innerHTML = `${meta}
      <div class="fc ${flipped ? 'flip' : ''}" id="fc" tabindex="0" role="button" aria-label="Karte umdrehen">
        <div class="fc-in">
          <div class="fc-f"><span class="fc-tag">${f.tag}${S.known[c.id] ? ' · gewusst' : ''}</span>${f.front}<span class="fc-hint">Klicken oder <span class="kbd">Leertaste</span> zum Umdrehen</span></div>
          <div class="fc-b"><span class="fc-tag">${deck === 'gram' ? 'Antwort' : dir === 'fd' ? 'Deutsch' : 'Französisch'}</span>${f.back}</div>
        </div>
      </div>
      <div class="fc-btns">${btns()}</div>`;
  }
  const btns = () => flipped
    ? `<button class="btn btn-no btn-lg" data-a="again" type="button">${icon('rotate')}Nochmals <span class="kbd">1</span></button><button class="btn btn-ok btn-lg" data-a="know" type="button">${icon('check')}Weiss ich <span class="kbd">2</span></button>`
    : `<button class="btn btn-p btn-lg" data-a="flip" type="button" style="grid-column:1/-1">${icon('repeat')}Umdrehen <span class="kbd">Leertaste</span></button>`;
  function flip() {
    flipped = !flipped;
    $('#fc', m)?.classList.toggle('flip', flipped);
    const b = $('.fc-btns', m);
    if (b) b.innerHTML = btns();
  }
  function rate(know) {
    const c = queue.shift();
    if (know) S.known[c.id] = 1;
    else { delete S.known[c.id]; queue.splice(Math.min(3, queue.length), 0, c); }
    save(); flipped = false; draw();
  }
  m.addEventListener('click', e => {
    const b = e.target.closest('[data-a],[data-d],[data-dir],#fc');
    if (!b) return;
    if (b.id === 'fc') return flip();
    if (b.dataset.d) { deck = b.dataset.d; S.fcDeck = deck; save(); return build(false); }
    if (b.dataset.dir) { dir = b.dataset.dir; S.fcDir = dir; save(); flipped = false; return draw(); }
    const a = b.dataset.a;
    if (a === 'flip') flip();
    if (a === 'know') rate(true);
    if (a === 'again') rate(false);
    if (a === 'shuffle') build(true);
    if (a === 'all') { onlyNew = false; S.fcOnlyNew = false; save(); build(true); }
    if (a === 'reset') { list.forEach(c => delete S.known[c.id]); save(); build(false); }
  });
  m.addEventListener('change', e => { if (e.target.id === 'fcNew') { onlyNew = e.target.checked; S.fcOnlyNew = onlyNew; save(); build(false); } });
  keyHandler = (e, typing) => {
    if (typing || !queue.length) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
    else if (flipped && (e.key === '1' || e.key === 'ArrowLeft')) rate(false);
    else if (flipped && (e.key === '2' || e.key === 'ArrowRight')) rate(true);
  };
  build(false);
};

    R = { list, queue: list.map(x => ({ ...x, retry: false })), right: 0, wrongs: [], done: 0, state: 'ask', last: null };
    keyHandler = (e, typing) => {

  function ask() {
    if (!R.queue.length) return result();

    const shown = fd ? it.v.fr : it.v.de;
    m.innerHTML = `<div class="page tr">
      <div class="scorebar">${scorebar(Math.min(R.done + 1, R.list.length))}</div>
      <div class="card tr-card">
        <span class="tr-ask">${fd ? 'Übersetze ins Deutsche' : 'Übersetze ins Französische'} · ${SECTIONS[it.v.sec].name}${it.retry ? ' · Wiederholung' : ''}</span>
        <div class="tr-word ${shown.length > 34 ? 'sm' : ''}">${esc(shown)}</div>
        <div class="tr-form"><input class="inp" id="vtIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${fd ? 'Deutsche Übersetzung' : 'Französisch, Nomen mit Artikel'}" aria-label="Deine Übersetzung"><button class="btn btn-p" data-a="check" type="button">Prüfen</button></div>
        <div id="vtFb"></div>
        <div class="row" id="vtTools"><button class="btn btn-g" data-a="hint" type="button">${icon('bulb')}Tipp</button><button class="btn btn-g" data-a="skip" type="button">Weiss ich nicht</button><span class="grow"></span><button class="btn btn-g" data-a="stop" type="button">Beenden</button></div>

  function check(skip) {

    R.last = { it, ok, val };
    if (!it.retry) { R.done++; if (ok) R.right++; else R.wrongs.push(it); }
    R.queue.shift();
    if (!ok && !it.retry) R.queue.push({ ...it, retry: true });
    $('.scorebar', m).innerHTML = scorebar(it.retry ? Math.min(R.done + 1, R.list.length) : R.done);
    const inp = $('#vtIn', m);
    inp.disabled = true;
    inp.classList.add(ok ? 'ok' : ['accent', 'hyphen', 'gender', 'article'].includes(r) ? 'al' : 'no');

    $('[data-a="next"]', m).focus({ preventScroll: true });
  }
  function accept() {
    const { it } = R.last;
    if (!it.retry) { R.right++; R.wrongs = R.wrongs.filter(x => x !== it); }
    R.queue = R.queue.filter(x => !(x.v === it.v && x.retry));
    next();
  }
  function next() { if (R.state === 'done') ask(); }
  function hint() {
    const it = R.queue[0];
    const sol = it.d === 'fd' ? firstDe(it.v).replace(/^(ein|eine|der|die|das)\s/i, '') : it.v.fr;
    const words = sol.split(' ');

    keyHandler = null;
    const n = R.list.length, g = gradeOf(R.right / n);

      <span class="badge-ic">${icon(R.right === n ? 'trophy' : 'keyboard')}</span>
      <div class="grade-l">Geschätzte Note</div><div class="grade">${fmtGrade(g)}</div>
      <h2>${R.right} von ${n} beim ersten Versuch richtig</h2>
      <p>${R.wrongs.length ? 'Die falschen Wörter hast du am Schluss nochmals geübt.' : 'Kein einziger Fehler. Stark!'}</p>
      <div class="row" style="justify-content:center;margin-top:8px">${R.wrongs.length ? `<button class="btn btn-p" data-a="redo" type="button">${icon('rotate')}Fehler üben</button>` : ''}<button class="btn ${R.wrongs.length ? 'btn-s' : 'btn-p'}" data-a="start" type="button">Neue Runde</button><button class="btn btn-g" data-a="settings" type="button">Einstellungen</button></div>
    </div>
    ${R.wrongs.length ? `<div class="sec-h"><h2>Diese Wörter übst du noch</h2></div><div class="wl">${R.wrongs.map(x => `<div class="wl-r"><span class="wl-fr">${esc(x.v.fr)}</span><span class="wl-de">${esc(x.v.de)}</span><span class="wl-ex">${esc(x.v.ex)}</span></div>`).join('')}</div>` : ''}</div>`;
    if (R.right === n) confetti();
  }
  m.addEventListener('click', e => {
    const b = e.target.closest('[data-a],[data-dir],[data-p],[data-c]');
    if (!b) return;
    if (b.dataset.dir) { dir = b.dataset.dir; S.vtDir = dir; save(); return settings(); }
    if (b.dataset.p) { part = b.dataset.p; S.vtPart = part; save(); return settings(); }
    if (b.dataset.c !== undefined) { count = +b.dataset.c; S.vtCount = count; save(); return settings(); }
    const a = b.dataset.a;
    if (a === 'start') start();
    if (a === 'check') check(false);
    if (a === 'skip') check(true);
    if (a === 'next') next();
    if (a === 'hint') hint();
    if (a === 'accept') accept();
    if (a === 'stop') result();
    if (a === 'settings') settings();
    if (a === 'redo') start(R.wrongs.map(x => ({ v: x.v, d: x.d })));
  });
  m.addEventListener('change', e => { if (e.target.id === 'vtStrict') { S.strict = e.target.checked; save(); } });
  settings();
};

/* ===== Formen-Drill ===== */
const PQP_SUBJ = [
  { s: 'je', p: 0 }, { s: 'tu', p: 1 }, { s: 'il', p: 2, g: 'm' }, { s: 'elle', p: 2, g: 'f' }, { s: 'on', p: 2, g: 'm' },
  { s: 'nous', p: 3, pl: true }, { s: 'vous', p: 4, pl: true }, { s: 'ils', p: 5, g: 'm', pl: true }, { s: 'elles', p: 5, g: 'f', pl: true }
];
function genPqp() {
  const AV = ['avais', 'avais', 'avait', 'avions', 'aviez', 'avaient'];
  const ET = ['étais', 'étais', 'était', 'étions', 'étiez', 'étaient'];
  const REF = ['me', 'te', 'se', 'nous', 'vous', 'se'];
  const [inf, pp, aux] = PQP_VERBS[Math.floor(Math.random() * PQP_VERBS.length)];
  const subs = aux === 'a' ? PQP_SUBJ : PQP_SUBJ.filter(s => s.s !== 'on');
  const sj = { ...subs[Math.floor(Math.random() * subs.length)] };
  if (aux !== 'a' && !sj.g) sj.g = Math.random() < .5 ? 'm' : 'f';
  const neg = Math.random() < .25;
  let part = pp;
  if (aux !== 'a') { if (sj.g === 'f') part += 'e'; if (sj.pl && !part.endsWith('s')) part += 's'; }
  const auxF = (aux === 'a' ? AV : ET)[sj.p];
  const toks = [sj.s, ...(neg ? ['ne'] : []), ...(aux === 'r' ? [REF[sj.p]] : []), auxF, ...(neg ? ['pas'] : []), part];
  const join = t => t.reduce((s, w, k) => {
    if (k === 0) return w;
    const prev = t[k - 1];
    if (['je', 'me', 'te', 'se', 'ne'].includes(prev) && /^[aeéiouh]/i.test(w)) return s.slice(0, -1) + '’' + w;
    return s + ' ' + w;
  }, '');
  const full = join(toks);
  const noSubj = join(toks.slice(1));
  let hint = '';
  if (aux !== 'a' && ['je', 'tu', 'nous', 'vous'].includes(sj.s)) hint = sj.pl ? (sj.g === 'f' ? ' (mehrere, weiblich)' : ' (mehrere, männlich)') : (sj.g === 'f' ? ' (weiblich)' : ' (männlich)');
  const verb = aux === 'r' ? inf.replace(/^se /, /^[aeéiouh]/i.test(inf.slice(3)) ? 's’' : 'se ') : inf;
  return {
    kind: 'pqp',
    prompt: `<b>${sj.s}</b>${hint} · ${verb}${neg ? ' · verneint' : ''}`,
    ask: 'Setze ins plus-que-parfait.',
    a: [full, noSubj],
    sol: full,
    ex: `${aux === 'a' ? 'avoir' : 'être'}${aux === 'r' ? ' (reflexives Verb)' : ''}: ${auxF} + ${pp}${part !== pp ? `, angeglichen: ${part}` : ''}${neg ? '. ne … pas steht um das Hilfsverb.' : '.'}`
  };
}
function genImp() {
  const d = DRILL_IMP[Math.floor(Math.random() * DRILL_IMP.length)];
  return { kind: 'imp', prompt: d.p, ask: /<b>/.test(d.p) ? 'Bilde den Imperativ. Ersetze den fetten Teil durch ein Pronomen.' : 'Bilde den Imperativ.', a: d.a, sol: d.a[0], ex: d.ex };
}
PAGES.drill = m => {

    <div class="tools"><div class="row"><div class="chips" id="drC"></div>${sw('drStrict', 'Akzente streng prüfen', S.strict)}</div></div>

    $('#drS', m).innerHTML = `<span><b>${right}</b> von ${total} richtig</span><span>Serie <b>${streak}</b></span><span>Beste Serie <b>${best}</b></span><span></span>`;

    inp.disabled = true;

    $('#drFb', m).innerHTML = feedback(r, S.strict, `${r === 'ok' ? '' : `Lösung: <b>${esc(item.sol)}</b><br>`}${esc(item.ex)}`);

  m.addEventListener('click', e => {

    if (!b) return;
    if (b.dataset.m) { mode = b.dataset.m; S.drMode = mode; save(); return next(); }

  m.addEventListener('change', e => { if (e.target.id === 'drStrict') { S.strict = e.target.checked; save(); } });

/* ===== Zuordnung (Drag and Drop, mit Antippen als Alternative) ===== */
PAGES.match = m => {
  let setIdx = S.mtSet || 0, pairs = [], order = [], toks = [], place = {}, sel = null, checked = false;
  function vocabPairs() {
    const used = new Set();
    return shuffle(WORDS.filter(v => firstDe(v).length <= 30)).filter(v => { const d = firstDe(v); if (used.has(d)) return false; used.add(d); return true; }).slice(0, 8).map(v => [v.fr, firstDe(v)]);
  }
  function load() {
    const set = MATCH[setIdx];
    pairs = set.random ? vocabPairs() : set.pairs.slice();
    order = shuffle(pairs.map((_, k) => k));
    toks = shuffle(pairs.map((_, k) => k));
    place = {}; sel = null; checked = false;
    draw();
  }
  const placed = t => Object.keys(place).find(z => place[z] === t);
  const tok = t => `<div class="tok ${sel === t ? 'sel' : ''}" draggable="true" data-t="${t}"><span>${esc(pairs[t][1])}</span><button class="x" data-x="${t}" type="button" aria-label="Entfernen">${icon('x')}</button></div>`;
  function draw() {
    const set = MATCH[setIdx];
    const free = toks.filter(t => placed(t) === undefined);
    const score = checked ? order.filter(z => place[z] === z).length : null;
    m.innerHTML = `<div class="page">${pageHead('Zuordnung', 'Ziehe jede Karte in das passende Feld. Auf dem Handy tippst du zuerst eine Karte und dann ein Feld an.')}
      <div class="tools"><div class="chips">${MATCH.map((s, k) => `<button class="chip ${k === setIdx ? 'on' : ''}" data-s="${k}" type="button">${s.title}</button>`).join('')}</div></div>
      <p style="margin:0 0 16px;font-weight:500">${set.task}</p>
      <div class="mt">
        <div class="mt-rows">${order.map(z => {
          const t = place[z];
          const st = checked ? (t === z ? 'ok' : 'no') : '';
          return `<div class="mt-row"><div class="mt-p">${esc(pairs[z][0])}</div><div class="zone ${st} ${sel !== null && t === undefined ? 'target' : ''}" data-z="${z}">${t !== undefined ? tok(t) : '<span class="zph">Hierher ziehen</span>'}${checked && t !== z ? `<span class="mt-sol">Richtig: ${esc(pairs[z][1])}</span>` : ''}</div></div>`;
        }).join('')}</div>
        <div class="pool" data-z="pool"><span class="pool-h">${free.length ? `Karten (${free.length})` : 'Alle Karten verteilt'}</span>${free.map(tok).join('')}</div>
      </div>
      <div class="row" style="margin-top:22px"><button class="btn btn-p" data-a="check" type="button">${icon('check')}Prüfen</button><button class="btn btn-s" data-a="reset" type="button">${icon('rotate')}Zurücksetzen</button>${set.random ? `<button class="btn btn-s" data-a="new" type="button">${icon('shuffle')}Neue Wörter</button>` : ''}
        ${score !== null ? `<span class="score" style="margin-left:8px">${score} von ${pairs.length} richtig</span>` : ''}</div>
    </div>`;
  }
  function putAt(t, z) {
    const from = placed(t);
    if (from !== undefined) delete place[from];
    if (z !== 'pool') place[z] = t;
    sel = null; checked = false;
    draw();
  }
  function check() {
    checked = true; sel = null; draw();
    if (order.every(z => place[z] === z)) confetti();
  }
  m.addEventListener('click', e => {
    const x = e.target.closest('[data-x]');
    if (x) { putAt(+x.dataset.x, 'pool'); return; }
    const t = e.target.closest('.tok');
    const z = e.target.closest('[data-z]');
    const n = t ? +t.dataset.t : null;
    // Karte im Vorrat antippen: auswählen
    if (t && z && z.dataset.z === 'pool') { sel = sel === n ? null : n; draw(); return; }
    // ausgewählte Karte in ein Feld (oder zurück in den Vorrat) legen
    if (sel !== null && z && n !== sel) { putAt(sel, z.dataset.z === 'pool' ? 'pool' : +z.dataset.z); return; }
    // Karte in einem Feld antippen: zum Verschieben auswählen
    if (t) { sel = sel === n ? null : n; draw(); return; }
    const b = e.target.closest('[data-a],[data-s]');
    if (!b) return;
    if (b.dataset.s !== undefined) { setIdx = +b.dataset.s; S.mtSet = setIdx; save(); return load(); }
    if (b.dataset.a === 'check') check();
    if (b.dataset.a === 'reset') { place = {}; sel = null; checked = false; draw(); }
    if (b.dataset.a === 'new') load();
  });
  m.addEventListener('dragstart', e => {
    const t = e.target.closest('.tok');
    if (!t) return;
    e.dataTransfer.setData('text/plain', t.dataset.t);
    e.dataTransfer.effectAllowed = 'move';
    t.classList.add('drag');
  });
  m.addEventListener('dragend', e => { e.target.closest?.('.tok')?.classList.remove('drag'); });
  m.addEventListener('dragover', e => {
    const z = e.target.closest('[data-z]');
    if (!z) return;
    e.preventDefault();
    $$('.over', m).forEach(o => o !== z && o.classList.remove('over'));
    z.classList.add('over');
  });
  m.addEventListener('dragleave', e => { const z = e.target.closest('[data-z]'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('over'); });
  m.addEventListener('drop', e => {
    const z = e.target.closest('[data-z]');
    if (!z) return;
    e.preventDefault();
    const t = e.dataTransfer.getData('text/plain');
    if (t === '') return;
    putAt(+t, z.dataset.z === 'pool' ? 'pool' : +z.dataset.z);
  });
  load();
};

      <div class="tools"><div class="row"><div class="chips">${GAPS.map((s, k) => `<button class="chip ${k === setIdx ? 'on' : ''}" data-s="${k}" type="button">${s.title}</button>`).join('')}</div>${sw('gapStrict', 'Akzente streng prüfen', S.strict)}</div></div>

        const [pre, ans, post] = it.t.split(/\{([^}]*)\}/);
        const w = Math.max(8, ans.split('|')[0].length + 3);
        return `<div class="gap"><span class="gap-n">${k + 1}</span><div><span class="gap-q">${esc(it.q)}</span>${esc(pre)}<input class="inp" data-k="${k}" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:${w}ch" aria-label="Lücke ${k + 1}">${esc(post)} <span class="hint">(${esc(it.h)})</span><span class="sol" id="sol${k}"></span></div></div>`;
      }).join('')}</div>
      <div class="row" style="margin-top:22px"><button class="btn btn-p" data-a="check" type="button">${icon('check')}Prüfen</button><button class="btn btn-s" data-a="show" type="button">${icon('eye')}Lösungen zeigen</button><button class="btn btn-g" data-a="reset" type="button">${icon('rotate')}Zurücksetzen</button><span class="score" id="gapScore"></span></div>
    </div>`;
  }
  const answers = k => GAPS[setIdx].items[k].t.match(/\{([^}]*)\}/)[1].split('|');
  function check() {
    let n = 0;
    $$('.gap .inp', m).forEach(inp => {
      const k = +inp.dataset.k, alts = answers(k);
      const { r } = CHECK.fr(inp.value, alts);
      const ok = CHECK.right(r, S.strict);
      const near = !ok && ['accent', 'hyphen'].includes(r);
      inp.classList.remove('ok', 'no', 'al');
      inp.classList.add(ok ? 'ok' : near ? 'al' : 'no');
      const sol = $('#sol' + k, m);
      sol.className = 'sol' + (near ? ' al' : '');
      sol.textContent = ok ? (r === 'accent' ? 'Richtig, aber achte auf den Akzent: ' + alts[0] : '') : `${near ? CHECK.MSG[r] + '. ' : ''}Richtig: ${alts[0]}`;
      if (ok) n++;
    });
    const total = GAPS[setIdx].items.length;
    $('#gapScore', m).textContent = `${n} von ${total} richtig`;
    if (n === total) confetti();
  }
  m.addEventListener('click', e => {
    const b = e.target.closest('[data-a],[data-s]');
    if (!b) return;
    if (b.dataset.s !== undefined) { setIdx = +b.dataset.s; S.gapSet = setIdx; save(); return draw(); }
    if (b.dataset.a === 'check') check();
    if (b.dataset.a === 'show') {
      $$('.gap .inp', m).forEach(inp => { const k = +inp.dataset.k; inp.value = answers(k)[0]; inp.classList.remove('ok', 'no', 'al'); $('#sol' + k, m).textContent = ''; });
      $('#gapScore', m).textContent = 'Lösungen eingefüllt';
    }
    if (b.dataset.a === 'reset') draw();
  });
  m.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || !e.target.matches('.gap .inp')) return;
    e.preventDefault();
    const all = $$('.gap .inp', m), k = all.indexOf(e.target);
    if (k < all.length - 1) all[k + 1].focus(); else check();
  });
  m.addEventListener('change', e => { if (e.target.id === 'gapStrict') { S.strict = e.target.checked; save(); } });
  draw();
};

/* ===== Start ===== */
$('#sbToggle').innerHTML = icon('chevL');
$('#menuBtn').innerHTML = icon('menu');
$('#backtop').innerHTML = icon('arrowUp');
$('#hubBtn').innerHTML = `${icon('arrowL')}<span class="hub-txt">Zurück zum LernHub</span>`;
$('#hubBtn').setAttribute('aria-label', 'Zurück zum LernHub');
$('#themeBtn').innerHTML = icon(document.documentElement.dataset.theme === 'dark' ? 'sun' : 'moon');
$('#themeBtn').addEventListener('click', toggleTheme);
$('#sbToggle').addEventListener('click', () => {
  S.sbCollapsed = document.documentElement.classList.toggle('sb-collapsed');
  save();
});
$('#menuBtn').addEventListener('click', () => document.documentElement.classList.add('sb-open'));
$('#backdrop').addEventListener('click', () => document.documentElement.classList.remove('sb-open'));
$('#backtop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
addEventListener('scroll', () => $('#backtop').classList.toggle('show', scrollY > 500), { passive: true });
addEventListener('hashchange', route);
renderObj();
route();

</script>
